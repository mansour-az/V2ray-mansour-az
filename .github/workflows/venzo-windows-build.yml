name: Build Venzo VPN for Windows

on:
  push:
    branches: [venzo-2.0, codex/venzo-windows-2.7.0-cyber]
    paths:
      - "venzo-windows/**"
      - ".github/workflows/venzo-windows-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: Windows app version without v prefix
        required: true
        default: 2.7.0
        type: string
      publish_release:
        description: Publish a GitHub prerelease after a successful build
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      UPSTREAM_TAG: v1.4.2
      UPSTREAM_COMMIT: 7bf58b82cd5c67c1be92e556cd0cea199f479d9f
      CORE_VERSION: 1.14.0-lx.26
      WINTUN_VERSION: 0.14.1
      BUILD_VERSION: ${{ inputs.version || '2.7.0' }}
      APP_VERSION: v${{ inputs.version || '2.7.0' }}
    steps:
      - name: Checkout Venzo source
        uses: actions/checkout@v4

      - name: Checkout pinned desktop base
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --depth 1 --branch $env:UPSTREAM_TAG https://github.com/Leadaxe/singbox-launcher.git desktop
          $actual = (git -C desktop rev-parse HEAD).Trim()
          if ($actual -ne $env:UPSTREAM_COMMIT) {
            throw "Unexpected upstream commit: $actual"
          }

      - name: Apply Venzo product patch
        shell: pwsh
        run: |
          $patchPath = (Resolve-Path 'venzo-windows/venzo-windows.patch').Path
          $patchText = (Get-Content $patchPath -Raw) -replace "`r`n", "`n"
          [IO.File]::WriteAllText($patchPath, $patchText, [Text.UTF8Encoding]::new($false))
          git -C desktop apply --check ../venzo-windows/venzo-windows.patch
          git -C desktop apply ../venzo-windows/venzo-windows.patch
          Copy-Item venzo-windows/fa.json desktop/internal/locale/fa.json
          Copy-Item venzo-windows/venzo_theme.go desktop/core/uiservice/venzo_theme.go
          Copy-Item venzo-windows/venzo_shell.go desktop/ui/venzo_shell.go
          Copy-Item venzo-windows/venzo_store.go desktop/ui/venzo_store.go
          Copy-Item venzo-windows/venzo_notifications.go desktop/ui/venzo_notifications.go
          Copy-Item venzo-windows/venzo_updater.go desktop/ui/venzo_updater.go
          Copy-Item venzo-windows/get_free.json desktop/bin/get_free.json
          [IO.File]::WriteAllBytes('desktop/assets/app.ico', [Convert]::FromBase64String((Get-Content 'venzo-windows/icon-app.ico.b64' -Raw).Trim()))
          [IO.File]::WriteAllBytes('desktop/assets/off.ico', [Convert]::FromBase64String((Get-Content 'venzo-windows/icon-off.ico.b64' -Raw).Trim()))
          [IO.File]::WriteAllBytes('desktop/assets/on.ico', [Convert]::FromBase64String((Get-Content 'venzo-windows/icon-on.ico.b64' -Raw).Trim()))

      - name: Reject visible upstream branding
        shell: pwsh
        run: |
          $runtimeFiles = @(
            'desktop/main.go',
            'desktop/ui/help_tab.go',
            'desktop/ui/core_dashboard_tab.go',
            'desktop/core/core_version.go',
            'desktop/core/config/configtypes/types.go',
            'desktop/app.manifest'
          )
          $bad = Select-String -Path $runtimeFiles -Pattern 'LxBox|singbox_launcher|Leadaxe/singbox-launcher/releases/latest|Singbox Launcher' | Where-Object { $_.Line -notmatch '^\s*//' }
          if ($bad) { $bad | Format-Table; throw 'Visible upstream branding remains' }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - name: Install Windows resource compiler
        shell: pwsh
        run: go install github.com/akavel/rsrc@latest

      - name: Download Go modules
        working-directory: desktop
        run: go mod download

      - name: Run focused tests
        working-directory: desktop
        shell: pwsh
        run: |
          go test ./core/config/configtypes ./core/config/subscription ./core/debugapi ./internal/locale
          go test ./ui -run TestDoesNotExist
      - name: Build Venzo VPN executable
        working-directory: desktop
        shell: cmd
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
        run: build\build_windows.bat nopause

      - name: Create complete portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging/bin | Out-Null
          Copy-Item desktop/Venzo-VPN.exe staging/Venzo-VPN.exe
          Copy-Item desktop/LICENSE staging/LICENSE
          Copy-Item venzo-windows/THIRD_PARTY_NOTICES.md staging/THIRD_PARTY_NOTICES.md
          Copy-Item desktop/bin/wizard_template.json staging/bin/wizard_template.json
          Copy-Item venzo-windows/get_free.json staging/bin/get_free.json
          @{
            lang = 'fa'
            last_template_launcher_version = $env:APP_VERSION
          } | ConvertTo-Json | Set-Content staging/bin/settings.json -Encoding utf8NoBOM

          $release = Invoke-RestMethod "https://api.github.com/repos/Leadaxe/sing-box-lx/releases/tags/v$env:CORE_VERSION"
          $asset = $release.assets | Where-Object { $_.name -like '*windows-amd64.zip' } | Select-Object -First 1
          if (-not $asset) { throw 'Pinned Windows core asset not found' }
          Invoke-WebRequest $asset.browser_download_url -OutFile core.zip
          Expand-Archive core.zip core-unpacked -Force
          $core = Get-ChildItem core-unpacked -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $core) { throw 'sing-box.exe missing from core archive' }
          Copy-Item $core.FullName staging/bin/sing-box.exe
          Get-ChildItem core-unpacked -Recurse -Filter 'libcronet*' | ForEach-Object { Copy-Item $_.FullName staging/bin/ }

          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip wintun-unpacked -Force
          $wintun = Get-ChildItem wintun-unpacked -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $wintun) { throw 'wintun.dll missing from archive' }
          Copy-Item $wintun.FullName staging/bin/wintun.dll

          Compress-Archive -Path staging/* -DestinationPath "Venzo-VPN-Windows-x64-$env:BUILD_VERSION.zip" -CompressionLevel Optimal

      - name: Verify a real VPN route on Windows
        shell: pwsh
        timeout-minutes: 7
        run: |
          Copy-Item staging smoke -Recurse -Force
          $resultPath = Join-Path $PWD 'venzo-connectivity-smoke.json'
          $env:VENZO_CONNECTIVITY_SMOKE = '1'
          $env:VENZO_SMOKE_RESULT = $resultPath
          # The hosted Windows runner is non-interactive. Skip the upstream
          # Mesa consent dialog; the tray smoke test does not render a window.
          $env:SINGBOX_LAUNCHER_NO_MESA = '1'
          $stdoutPath = Join-Path $PWD 'venzo-smoke.stdout.log'
          $stderrPath = Join-Path $PWD 'venzo-smoke.stderr.log'
          $process = Start-Process -FilePath (Resolve-Path 'smoke\Venzo-VPN.exe') -WorkingDirectory (Resolve-Path smoke) -ArgumentList '-tray' -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $deadline = (Get-Date).AddMinutes(6)
            $result = $null
            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) { throw "Venzo exited before completing the smoke test (exit $($process.ExitCode))" }
              if (Test-Path $resultPath) {
                try { $result = Get-Content $resultPath -Raw | ConvertFrom-Json } catch { $result = $null }
                if ($result -and $result.completed) { break }
              }
              Start-Sleep -Seconds 2
            }
            if (-not $result -or -not $result.completed) {
              if (Test-Path $resultPath) { Get-Content $resultPath -Raw | Write-Host }
              throw 'Venzo connectivity smoke test timed out before a final result'
            }
            $result | ConvertTo-Json | Write-Host
            if (-not $result.verified) { throw "Real VPN route was not verified: $($result.failure)" }
            if (-not $result.proxy) { throw 'No active proxy was reported by the real connection test' }
            if ($result.baseline_ip -eq $result.current_ip) { throw 'Public IP did not change through Venzo VPN' }
          } finally {
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath | Write-Host }
            if (Test-Path $stderrPath) { Get-Content $stderrPath | Write-Host }
            Get-ChildItem $env:APPDATA,$env:LOCALAPPDATA -Recurse -Filter 'venzo-vpn.log' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 200 }
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            Get-Process sing-box -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          & $iscc "/DAppVersion=$env:BUILD_VERSION" venzo-windows/installer.iss

      - name: Build and sign MSIX package
        shell: pwsh
        run: |
          $parts = @($env:BUILD_VERSION.Split('.') | ForEach-Object { [int]$_ })
          while ($parts.Count -lt 4) { $parts += 0 }
          if ($parts.Count -gt 4) { throw 'MSIX version must contain at most four numeric parts' }
          $msixVersion = $parts -join '.'
          $layout = Join-Path $PWD 'msix-layout'
          New-Item -ItemType Directory -Force "$layout\Assets" | Out-Null
          Copy-Item staging\* $layout -Recurse -Force
          (Get-Content venzo-windows\AppxManifest.xml.in -Raw).Replace('__VERSION__', $msixVersion) |
            Set-Content "$layout\AppxManifest.xml" -Encoding utf8

          Add-Type -AssemblyName System.Drawing
          $sourceIcon = [System.Drawing.Icon]::new((Resolve-Path 'desktop\assets\app.ico').Path)
          $sourceBitmap = $sourceIcon.ToBitmap()
          function Write-Logo([int]$width, [int]$height, [string]$name) {
            $bitmap = [System.Drawing.Bitmap]::new($width, $height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.Clear([System.Drawing.Color]::FromArgb(7, 10, 16))
            $graphics.DrawImage($sourceBitmap, 0, 0, $width, $height)
            $bitmap.Save((Join-Path "$layout\Assets" $name), [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          Write-Logo 50 50 'StoreLogo.png'
          Write-Logo 44 44 'Square44x44Logo.png'
          Write-Logo 150 150 'Square150x150Logo.png'
          Write-Logo 310 150 'Wide310x150Logo.png'
          $sourceBitmap.Dispose()
          $sourceIcon.Dispose()

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx -or -not $signtool) { throw 'Windows SDK packaging tools are unavailable' }
          $msix = "Venzo-VPN-Windows-x64-$env:BUILD_VERSION.msix"
          & $makeappx.FullName pack /d $layout /p $msix /o

          $certificate = New-SelfSignedCertificate -Type Custom -Subject 'CN=Venzo VPN' -KeyUsage DigitalSignature `
            -FriendlyName 'Venzo VPN Release' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          $passwordText = [guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          Export-Certificate -Cert $certificate -FilePath Venzo-VPN-Release.cer | Out-Null
          Export-PfxCertificate -Cert $certificate -FilePath venzo-signing.pfx -Password $password | Out-Null
          & $signtool.FullName sign /fd SHA256 /f venzo-signing.pfx /p $passwordText $msix
          & $signtool.FullName sign /fd SHA256 /f venzo-signing.pfx /p $passwordText "venzo-windows\dist\Venzo-VPN-Setup-$env:BUILD_VERSION.exe"
          Remove-Item venzo-signing.pfx -Force

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @(
            "Venzo-VPN-Windows-x64-$env:BUILD_VERSION.zip",
            "venzo-windows/dist/Venzo-VPN-Setup-$env:BUILD_VERSION.exe",
            "Venzo-VPN-Windows-x64-$env:BUILD_VERSION.msix",
            "Venzo-VPN-Release.cer"
          )
          $files | ForEach-Object {
            $h = Get-FileHash $_ -Algorithm SHA256
            "$($h.Hash.ToLower())  $($_ -replace '\\','/')"
          } | Set-Content SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Venzo-VPN-Windows-${{ inputs.version || '2.7.0' }}
          path: |
            Venzo-VPN-Windows-x64-${{ inputs.version || '2.7.0' }}.zip
            venzo-windows/dist/Venzo-VPN-Setup-${{ inputs.version || '2.7.0' }}.exe
            Venzo-VPN-Windows-x64-${{ inputs.version || '2.7.0' }}.msix
            Venzo-VPN-Release.cer
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish Windows prerelease
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ inputs.version || '2.7.0' }}
          name: Venzo VPN for Windows ${{ inputs.version || '2.7.0' }}
          prerelease: true
          generate_release_notes: false
          body: |
            نسخه دسکتاپ Venzo VPN 2.7.0 برای Windows 10/11 x64 با رابط Cyber Pulse، اتصال تأییدشده، حساب کاربری، پرداخت آبان و اعلان‌های بومی Windows.

            فایل `Setup` برای نصب معمولی، فایل `MSIX` برای نصب بسته‌ای و فایل ZIP برای اجرای پرتابل است. برای MSIX گواهی عمومی همراه Release را در Trusted People نصب کنید.
          files: |
            Venzo-VPN-Windows-x64-${{ inputs.version || '2.7.0' }}.zip
            venzo-windows/dist/Venzo-VPN-Setup-${{ inputs.version || '2.7.0' }}.exe
            Venzo-VPN-Windows-x64-${{ inputs.version || '2.7.0' }}.msix
            Venzo-VPN-Release.cer
            SHA256SUMS.txt

      - name: Publish update manifest
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        shell: pwsh
        run: |
          $installer = "venzo-windows/dist/Venzo-VPN-Setup-$env:BUILD_VERSION.exe"
          $sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $tag = "windows-v$env:BUILD_VERSION"
          $base = "https://github.com/mansour-az/V2ray-mansour-az/releases/download/$tag"
          $manifest = [ordered]@{
            version = $env:BUILD_VERSION
            tag_name = "v$env:BUILD_VERSION"
            tag = $tag
            name = "Venzo VPN for Windows $env:BUILD_VERSION"
            installer_url = "$base/Venzo-VPN-Setup-$env:BUILD_VERSION.exe"
            portable_url = "$base/Venzo-VPN-Windows-x64-$env:BUILD_VERSION.zip"
            sha256 = $sha256
            release_url = "https://github.com/mansour-az/V2ray-mansour-az/releases/tag/$tag"
          }
          $manifest | ConvertTo-Json | Set-Content venzo-windows/latest-windows.json -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add venzo-windows/latest-windows.json
          git commit -m "Update Windows release channel to $env:BUILD_VERSION [skip ci]"
          git push origin HEAD:venzo-2.0
