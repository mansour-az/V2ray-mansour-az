name: Check LxBox upstream for Venzo

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: venzo-2.0

      - name: Find latest upstream release
        id: latest
        run: |
          set -euo pipefail
          TAG="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Leadaxe/LxBox/releases/latest | jq -r '.tag_name')"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify Venzo patches against upstream
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < venzo2/lxbox-upstream.txt)"
          LATEST="${{ steps.latest.outputs.tag }}"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "Already current: $CURRENT"
            exit 0
          fi
          git clone --branch "$LATEST" --depth 1 https://github.com/Leadaxe/LxBox.git /tmp/venzo-upstream
          cd /tmp/venzo-upstream
          git apply --check "$GITHUB_WORKSPACE/venzo2/venzo-lxbox.patch"
          git apply "$GITHUB_WORKSPACE/venzo2/venzo-lxbox.patch"
          git apply --check "$GITHUB_WORKSPACE/venzo2/venzo-free-catalog.patch"
          git apply "$GITHUB_WORKSPACE/venzo2/venzo-free-catalog.patch"
          git apply --check "$GITHUB_WORKSPACE/venzo2/venzo-white-label.patch"

      - name: Advance audited upstream ref
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < venzo2/lxbox-upstream.txt)"
          LATEST="${{ steps.latest.outputs.tag }}"
          if [ "$CURRENT" = "$LATEST" ]; then exit 0; fi
          printf '%s\n' "$LATEST" > venzo2/lxbox-upstream.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add venzo2/lxbox-upstream.txt
          git commit -m "chore: sync Venzo base to LxBox $LATEST"
          git push origin HEAD:venzo-2.0
