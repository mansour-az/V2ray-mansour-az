name: Venzo v3 RC

on:
  push:
    branches: [venzo-v3.0-rc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install libXray v26.7.28
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/libxray
          curl -L --fail --retry 3 \
            -o /tmp/libxray-android.zip \
            https://github.com/XTLS/libXray/releases/download/v26.7.28/libxray-android.zip
          echo '28b7dc9d6cc8455fcca5cbd56e387003a7bfb558128651a64899dc3a8ccff666  /tmp/libxray-android.zip' | sha256sum -c -
          unzip -q /tmp/libxray-android.zip -d /tmp/libxray
          AAR_PATH="$(find /tmp/libxray -type f -name '*.aar' | head -n 1)"
          test -n "$AAR_PATH"
          cp "$AAR_PATH" app/libs/libXray.aar
          ls -lh app/libs/libXray.aar

      - name: Compile Android RC
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: venzo-v3.0-rc-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
