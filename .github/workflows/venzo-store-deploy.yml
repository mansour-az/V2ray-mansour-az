name: Deploy Venzo Store API

# Security refresh: Telegram gate and Aban-only payments 2026-08-29

on:
  workflow_dispatch:
  push:
    branches:
      - venzo-2.0
    paths:
      - venzo2/store-api/**
      - .github/workflows/venzo-store-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PasarGuard API
        env:
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PASARGUARD_BASE_URL:-}" ] || [ -z "${PASARGUARD_API_KEY:-}" ]; then
            echo "Missing PasarGuard repository secrets" >&2
            exit 1
          fi
          status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/pasarguard-groups.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header "X-API-Key: $PASARGUARD_API_KEY" \
              "${PASARGUARD_BASE_URL%/}/api/groups/simple"
          )"
          if [ "$status" != "200" ]; then
            echo "PasarGuard API verification failed with HTTP $status" >&2
            exit 1
          fi
          jq -e '
            if type == "array" then .
            elif (.groups | type) == "array" then .groups
            elif (.data | type) == "array" then .data
            elif (.data.groups | type) == "array" then .data.groups
            else error("Unsupported PasarGuard groups response")
            end
            | type == "array"
          ' "$RUNNER_TEMP/pasarguard-groups.json" >/dev/null
          echo "PasarGuard API verified successfully"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          ABAN_API_TOKEN: ${{ secrets.ABAN_API_TOKEN }}
          ABAN_WEBHOOK_SECRET: ${{ secrets.ABAN_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_REQUIRED_CHANNEL: ${{ secrets.TELEGRAM_REQUIRED_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            PASARGUARD_BASE_URL PASARGUARD_API_KEY PROVISION_SECRET
            ABAN_API_TOKEN ABAN_WEBHOOK_SECRET
            TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET TELEGRAM_BOT_USERNAME
            TELEGRAM_REQUIRED_CHANNEL TELEGRAM_OWNER_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret or variable: $name" >&2
              exit 1
            fi
          done
          if [ "${#PROVISION_SECRET}" -lt 8 ]; then
            echo "PROVISION_SECRET must be at least 8 characters" >&2
            exit 1
          fi

      - name: Test Store API
        working-directory: venzo2/store-api
        run: |
          npm run check
          npm test

      - name: Deploy Worker and encrypted secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: venzo2/store-api
          wranglerVersion: 4.45.0
          command: deploy --config wrangler.jsonc
          secrets: |
            PASARGUARD_BASE_URL
            PASARGUARD_API_KEY
            PROVISION_SECRET
            ABAN_API_TOKEN
            ABAN_WEBHOOK_SECRET
            TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET
            TELEGRAM_BOT_USERNAME
            TELEGRAM_REQUIRED_CHANNEL
            TELEGRAM_OWNER_ID
        env:
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          ABAN_API_TOKEN: ${{ secrets.ABAN_API_TOKEN }}
          ABAN_WEBHOOK_SECRET: ${{ secrets.ABAN_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_REQUIRED_CHANNEL: ${{ secrets.TELEGRAM_REQUIRED_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}

      - name: Configure Telegram webhook
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc \
              --arg url "${DEPLOYMENT_URL%/}/v1/auth/telegram/webhook" \
              --arg secret "$TELEGRAM_WEBHOOK_SECRET" \
              '{url:$url,secret_token:$secret,allowed_updates:["message","callback_query"],drop_pending_updates:false}')" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook")"
          jq -e '.ok == true and .result == true' <<<"$response" >/dev/null

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Worker deployed to ${DEPLOYMENT_URL}"
