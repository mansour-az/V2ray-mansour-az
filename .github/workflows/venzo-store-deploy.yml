name: Deploy Venzo Store API

on:
  workflow_dispatch:
  push:
    branches:
      - venzo-2.0
    paths:
      - venzo2/store-api/**
      - .github/workflows/venzo-store-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PasarGuard API
        env:
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PASARGUARD_BASE_URL:-}" ] || [ -z "${PASARGUARD_API_KEY:-}" ]; then
            echo "Missing PasarGuard repository secrets" >&2
            exit 1
          fi
          status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/pasarguard-groups.json" \
              --write-out '%{http_code}' \
              --header 'Accept: application/json' \
              --header "X-API-Key: $PASARGUARD_API_KEY" \
              "${PASARGUARD_BASE_URL%/}/api/groups/simple"
          )"
          if [ "$status" != "200" ]; then
            echo "PasarGuard API verification failed with HTTP $status" >&2
            exit 1
          fi
          jq -e '
            if type == "array" then .
            elif (.groups | type) == "array" then .groups
            elif (.data | type) == "array" then .data
            elif (.data.groups | type) == "array" then .data.groups
            else error("Unsupported PasarGuard groups response")
            end
            | type == "array"
          ' "$RUNNER_TEMP/pasarguard-groups.json" >/dev/null
          echo "PasarGuard API verified successfully"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          TRON_WALLET_ADDRESS: ${{ secrets.TRON_WALLET_ADDRESS }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
            PASARGUARD_BASE_URL PASARGUARD_API_KEY PROVISION_SECRET
            TRON_WALLET_ADDRESS TRONGRID_API_KEY CARD_NUMBER CARD_HOLDER
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub secret or variable: $name" >&2
              exit 1
            fi
          done

      - name: Deploy Worker and encrypted secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: venzo2/store-api
          wranglerVersion: 4.45.0
          command: deploy --config wrangler.jsonc
          secrets: |
            PASARGUARD_BASE_URL
            PASARGUARD_API_KEY
            PROVISION_SECRET
            TRON_WALLET_ADDRESS
            TRONGRID_API_KEY
            CARD_NUMBER
            CARD_HOLDER
        env:
          PASARGUARD_BASE_URL: ${{ secrets.PASARGUARD_BASE_URL }}
          PASARGUARD_API_KEY: ${{ secrets.PASARGUARD_API_KEY }}
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          TRON_WALLET_ADDRESS: ${{ secrets.TRON_WALLET_ADDRESS }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          CARD_NUMBER: ${{ secrets.CARD_NUMBER }}
          CARD_HOLDER: ${{ secrets.CARD_HOLDER }}

      - name: Show deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: echo "Worker deployed to ${DEPLOYMENT_URL}"
