name: Build Venzo VPN 2.6.0

# Public release request: 2026-08-27 connectivity fix

on:
  push:
    branches: [venzo-2.0, codex/venzo-mobile-2.6.0-connectivity]
    paths:
      - "venzo2/**"
      - ".github/workflows/venzo-vpn-build.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified artifacts as GitHub Release v2.6.0
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Venzo build inputs
        uses: actions/checkout@v4

      - name: Clone audited LxBox base
        run: |
          UPSTREAM_REF="$(tr -d '[:space:]' < venzo2/lxbox-upstream.txt)"
          if [[ ! "$UPSTREAM_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid upstream ref: $UPSTREAM_REF" >&2
            exit 1
          fi
          git clone --branch "$UPSTREAM_REF" --depth 1 https://github.com/Leadaxe/LxBox.git venzo-src

      - name: Apply Venzo VPN customization
        run: |
          cd venzo-src
          git apply ../venzo2/venzo-lxbox.patch
          git apply ../venzo2/venzo-free-catalog.patch
          git apply ../venzo2/venzo-white-label.patch
          git apply ../venzo2/venzo-myapp-mobile.patch
          git apply ../venzo2/venzo-payment-gateways.patch
          # This generated incremental patch is maintained independently from
          # the upstream files; recount makes edited hunk sizes deterministic.
          git apply --recount ../venzo2/venzo-connectivity-privacy.patch
          base64 --decode ../venzo2/icon.jpg.b64 > app/assets/icons/app_icon.png

      - name: Read Flutter version
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < venzo-src/app/android/flutter.version)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}
          cache: true

      - name: Install dependencies and generate icons
        working-directory: venzo-src/app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Analyze and test Venzo additions
        working-directory: venzo-src/app
        run: |
          flutter analyze
          flutter test test/services/venzo_managed_subscriptions_test.dart
          flutter test test/services/venzo_premium_test.dart
          flutter test test/services/venzo_payment_gateways_test.dart
          flutter test test/services/venzo_connection_verifier_test.dart
          flutter test test/controllers/venzo_smart_connect_test.dart
          flutter test test/services/l10n/persian_locale_test.dart
          flutter test test/services/update_checker_test.dart
          flutter test test/screens/update_snackbar_test.dart

      - name: Configure permanent release signing
        working-directory: venzo-src/app/android
        env:
          VENZO_KEYSTORE_BASE64: ${{ secrets.VENZO_KEYSTORE_BASE64 }}
          VENZO_STORE_PASSWORD: ${{ secrets.VENZO_STORE_PASSWORD }}
          VENZO_KEY_PASSWORD: ${{ secrets.VENZO_KEY_PASSWORD }}
          VENZO_KEY_ALIAS: ${{ secrets.VENZO_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in VENZO_KEYSTORE_BASE64 VENZO_STORE_PASSWORD VENZO_KEY_PASSWORD VENZO_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$VENZO_KEYSTORE_BASE64" | base64 --decode > venzo-release.jks
          chmod 600 venzo-release.jks
          {
            echo "storeFile=venzo-release.jks"
            echo "storePassword=$VENZO_STORE_PASSWORD"
            echo "keyAlias=$VENZO_KEY_ALIAS"
            echo "keyPassword=$VENZO_KEY_PASSWORD"
          } > key.properties
          chmod 600 key.properties

      - name: Fetch verified sing-box-lx core
        working-directory: venzo-src
        run: ./scripts/fetch-libbox.sh

      - name: Build arm64 APK
        working-directory: venzo-src/app
        env:
          LXBOX_ABI_FILTER: arm64-v8a
        run: >-
          flutter build apk --release --flavor github
          --target-platform android-arm64
          --dart-define=VENZO_API_BASE=https://venzo-store-api.mascot-gt.workers.dev
          --dart-define=LXBOX_DISTRIBUTION=github
          --build-name 2.6.0
          --build-number 20600000

      - name: Build Play Store app bundle
        working-directory: venzo-src/app
        run: >-
          flutter build appbundle --release --flavor play
          --dart-define=VENZO_API_BASE=https://venzo-store-api.mascot-gt.workers.dev
          --dart-define=LXBOX_DISTRIBUTION=play
          --build-name 2.6.0
          --build-number 20600000

      - name: Name release files
        run: |
          cp venzo-src/app/build/app/outputs/flutter-apk/app-github-release.apk Venzo-VPN-2.6.0-arm64.apk
          cp venzo-src/app/build/app/outputs/bundle/playRelease/app-play-release.aab Venzo-VPN-2.6.0.aab

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose --print-certs Venzo-VPN-2.6.0-arm64.apk

      - name: Create checksums
        run: sha256sum Venzo-VPN-2.6.0-arm64.apk Venzo-VPN-2.6.0.aab > SHA256SUMS.txt

      - name: Upload APK and Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: Venzo-VPN-2.6.0-release
          path: |
            Venzo-VPN-2.6.0-arm64.apk
            Venzo-VPN-2.6.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: "${{ github.ref == 'refs/heads/venzo-2.0' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.event.head_commit.message == 'release: publish Venzo VPN 2.6.0')) }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            '# Venzo VPN 2.6.0' \
            '' \
            '- اتصال هوشمند و انتخاب خودکار کانفیگ سالم' \
            '- آزمایش چند سرور با عبور واقعی اینترنت، نه فقط Ping' \
            '- تأیید تغییر IP عمومی پیش از نمایش وضعیت متصل' \
            '- خطای مشخص برای سرورهای دارای Ping بدون اینترنت' \
            '- مرکز حریم خصوصی برای DNS، WebRTC و کاهش Fingerprint' \
            '- رابط ساده فارسی با تم قرمز' \
            '- استفاده از لوگوی رسمی Venzo داخل برنامه' \
            '- نمایش لوکیشن، نوع کانفیگ و پینگ اتصال' \
            '- فهرست سرورهای سالم با انتخاب دستی' \
            '- منابع فیلترشده MyAppVPN، Universal و Reality با مسیرهای جایگزین' \
            '- طراحی مینیمال جدید با حالت روز و شب و نوار ناوبری پایین' \
            '- بروزرسانی درون‌برنامه‌ای امن برای نسخه نصب‌شده از GitHub' \
            '- موتور خودکار جست‌وجو و تجمیع منابع رایگان' \
            '- فروشگاه پلن‌ها با API امن برای اتصال به PasarGuard' \
            '- پرداخت رمزارزی OxaPay و زیرساخت امن درگاه‌های میزبانی‌شده' \
            '- حذف کامل نام و لینک‌های LxBox از رابط و اعلان‌ها' \
            '- دریافت اعلان به‌روزرسانی فقط از GitHub رسمی Venzo VPN' \
            '- همگام‌سازی امن سورس پایه با نسخه‌های جدید upstream' \
            '' \
            'فایل APK برای نصب مستقیم روی دستگاه‌های arm64 است. فایل AAB فقط برای Google Play Console استفاده می‌شود.' \
            > release-notes.md
          gh release create v2.6.0 \
            --target "$GITHUB_SHA" \
            --title 'Venzo VPN 2.6.0' \
            --notes-file release-notes.md \
            Venzo-VPN-2.6.0-arm64.apk \
            Venzo-VPN-2.6.0.aab \
            SHA256SUMS.txt

      - name: Update in-app release channel
        if: "${{ github.ref == 'refs/heads/venzo-2.0' && ((github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && github.event.head_commit.message == 'release: publish Venzo VPN 2.6.0')) }}"
        run: |
          APK_SHA="$(sha256sum Venzo-VPN-2.6.0-arm64.apk | cut -d' ' -f1)"
          jq -n \
            --arg tag 'v2.6.0' \
            --arg name 'Venzo VPN 2.6.0' \
            --arg url 'https://github.com/mansour-az/V2ray-mansour-az/releases/tag/v2.6.0' \
            --arg apk 'https://github.com/mansour-az/V2ray-mansour-az/releases/download/v2.6.0/Venzo-VPN-2.6.0-arm64.apk' \
            --arg sha "$APK_SHA" \
            '{tag:$tag,name:$name,html_url:$url,published_at:(now|todate),apk_url:$apk,sha256:$sha}' \
            > venzo2/latest.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add venzo2/latest.json
          git commit -m 'chore: update Venzo mobile release channel [skip ci]'
          git push origin HEAD:venzo-2.0
